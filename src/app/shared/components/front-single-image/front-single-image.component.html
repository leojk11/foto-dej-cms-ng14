@if (imagesUrl && image) {
  <div class="gallery-image w-full flex justify-center align-center"
    >
    @if (!loaded) {
      <app-spinner></app-spinner>
    }
    <img [src]="imagesUrl + image" [alt]="image" class="cp" [class.hidden]="!loaded"
      (load)="onLoad()" (click)="toggleOverview($event, imagesToDisplay)">
    </div>
  }
