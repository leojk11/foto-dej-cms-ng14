<div class="log">
  <div class="log__body">
    <div class="log__body--icon">
      <i class="pi pi-desktop" *ngIf="log.action === 'LOGIN'"></i>
      <i class="pi pi-power-off" *ngIf="log.action === 'LOGOUT'"></i>
      <i class="pi pi-pencil" *ngIf="log.action === 'UPDATED_PROFILE'"></i>
      <i class="pi pi-images" *ngIf="log.action === 'SELECTED_IMAGES'"></i>
      <i class="pi pi-check-circle" *ngIf="log.action === 'ACTIVATE_ACCOUNT'"></i>
    </div>

    <div class="log__body--title">
      <strong> {{ log.client.fullname }} </strong>
      
      <span *ngIf="log.action === 'LOGIN'" >
        {{ 'logs.userLogin' | translate }}
      </span>
      <span *ngIf="log.action === 'LOGOUT'">
        {{ 'logs.userLogout' | translate }}
      </span>
      <span *ngIf="log.action === 'UPDATED_PROFILE'">
        {{ 'logs.userUpdatedProfile' | translate }}
      </span>
      <span *ngIf="log.action === 'SELECTED_IMAGES'">
        {{ 'logs.userSelectedImages' | translate }}
      </span>
      <span *ngIf="log.action === 'ACTIVATE_ACCOUNT'">
        {{ 'logs.userAccountActivation' | translate }}
      </span>
    </div>
  </div>

  <span class="log__time">
    {{ log.date | date: 'dd/MM/YYYY' }} {{ log.time }}
  </span>
</div>
