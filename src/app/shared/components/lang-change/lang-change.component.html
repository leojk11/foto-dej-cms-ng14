@if (langService.langState$ | async; as state) {
  <div
    class="container__flex justify-center"
    >
    <p-selectbutton
      [options]="languageOptions"
      [(ngModel)]="state.language"
      (onChange)="changeLang($event)"
      optionLabel="label"
      optionValue="value"
    ></p-selectbutton>
  </div>
}
