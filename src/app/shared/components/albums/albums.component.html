<div class="albums">
  <div class="albums__header">
    <button
      class="btn btn__icon btn__icon--blue shadow-small border-none"
      (click)="location.back()"
    >
      <i class="pi pi-arrow-left"></i>
    </button>

    <div class="container__flex gap-2">
      <button 
        class="btn btn__search px-2"
        (click)="filterOp.toggle($event)"
      >
        Search
        <i class="pi pi-search"></i>
      </button>
  
      <button
        class="btn btn__main albums-buttons__add-button"
        type="submit"
        (click)="openAddModal()"
        *permit="'BO'"
      >
        {{ 'albums.addNewAlbum' | translate }}
      </button>
    </div>
  </div>

  <div class="separator"></div>
  
  <div *ngIf="state" class="relative">
    <div *ngIf="!state.loading" class="albums__content">
      <div
        class="single-album-wrapper"
        *ngFor="let album of state.list"
      >
        <app-single-album
          [album]="album"
        ></app-single-album>
      </div>

    </div>
    <p-paginator 
      *ngIf="state.total > state.params.take"
      [rows]="state.params.take"
      [totalRecords]="state.total"
      (onPageChange)="onPageChange($event)"
    ></p-paginator>
  
    <div class="page__loading" *ngIf="state.loading">
      <app-spinner></app-spinner>
    </div>
  </div>
</div>

<p-overlayPanel #filterOp appendTo="body">
  <div class="albums__header--filter">
    <input 
      type="text" 
      pInputText
      class="w-25r"
      placeholder="{{ 'common.searchName' | translate}}"
      [(ngModel)]="nameSearch"
      (keydown.enter)="filter()"
    >
    
    <input 
      type="text" 
      pInputText
      class="w-25r"
      placeholder="{{ 'common.searchDate' | translate}}"
      [(ngModel)]="dateSearch"
      (keydown.enter)="filter()"
    >

    <div class="container__flex gap-1 justify-center">
      <button 
        pButton
        type="button"
        class="btn btn__icon--orange px-1"
        (click)="filter()"
      >
        <i class="pi pi-filter"></i>
        Search
      </button>

      <button 
        pButton
        type="button"
        class="btn btn__icon--dark px-1"
        (click)="clearFilter(); filterOp.toggle($event)"
      >
        <i class="pi pi-filter-slash"></i>
        Reset
      </button>
    </div>
  </div>
</p-overlayPanel>
