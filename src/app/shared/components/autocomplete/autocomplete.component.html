<div class="custom-ac-wrapper" [style]="{ 'width': '100%' }" >
  <div class="custom-ac-input" [style]="{ 'width': '100%' }">
    <input 
      type="text" 
      [(ngModel)]="inputValue"
      [readonly]="disabled"
      placeholder="{{ placeholder | translate }}..."
      (keyup)="onInputChange()"
      (focus)="onInputFocus()"
      [class.p-disabled]="disabled"
    />

    <span class="material-symbols-outlined icon" (click)="toggleDropdown()">
      expand_more
    </span>
  </div>
  
  <div 
    @fadeInAnimation class="custom-ac-dropdown p-3" 
    *ngIf="showDropdown" 
    [style]="{ 'width': '100%', 'height': '200px' }">
  
      <cdk-virtual-scroll-viewport
        style="height: 180px; margin-bottom: 120px"
        itemSize="50" minBufferPx="50" maxBufferPx="50">
        <div *cdkVirtualFor="let option of options">
          <h1 
            [style]="{ 'height': '50px' }"
            class="py-2" 
            (click)="onValueSelect(option)"
          >{{ option.description }}</h1>
        </div>
      </cdk-virtual-scroll-viewport>
  </div>
</div>

<div
  class="transparent-bg" 
  *ngIf="showDropdown" 
  (click)="toggleDropdown()"
></div>
