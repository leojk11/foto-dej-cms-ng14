<p-tabView 
  [(activeIndex)]="tabsIndex" 
  (onChange)="onTabChange()">
  <p-tabPanel header="{{ 'common.all' | translate }}">
    <ng-container *ngIf="tabsIndex === 0">
      <ng-container 
        *ngTemplateOutlet="albumImages"
      ></ng-container>
    </ng-container>
  </p-tabPanel>

  <p-tabPanel header="{{ 'common.selected' | translate }}">
    <ng-container *ngIf="tabsIndex === 1">
      <ng-container 
        *ngTemplateOutlet="albumImages"
      ></ng-container>
    </ng-container>
  </p-tabPanel>
</p-tabView>

<ng-template #albumImages>
  <div class="album">
    <div class="album__top">
      <!-- WILL USE THIS IN THE FUTURE -->
      <!-- <button
        *ngIf="(!showSelected && images!.length > 0) || (showSelected && selectedImages.length > 0) || imageSearch"
        class="btn btn__icon--blue"
        type="button"
        (click)="searchOp.toggle($event)"
      >
        <i class="pi pi-search"></i>
      </button> -->
      <!-- WILL USE THIS IN THE FUTURE -->

      <div class="album__top--actions" *ngIf="(!showSelected && images!.length > 0) || (showSelected && selectedImages.length > 0)">
        <button
          class="btn btn__icon--blue"
          type="button"
          (click)="deselectAllImages()"
          *ngIf="selectedImages.length > 0 && !isAdmin"
          pTooltip="{{ 'common.unselectAll' | translate }}" 
          tooltipPosition="top"
        >
          <i class="pi pi-times-circle"></i>
        </button>

        <button
          class="btn btn__icon--green"
          type="button"
          pTooltip="{{ 'common.saveSelected' | translate }}" 
          tooltipPosition="top"
          *ngIf="selectedImages.length > 0 && !isAdmin"
          (click)="saveSelected()"
        >
          <i class="pi pi-check"></i>
        </button>

        <!-- ADMIN BUTTONS -->
        <ng-container *ngIf="!showSelected">
          <ng-container *permit="'BO'">
            <button
              class="btn btn__icon--blue"
              type="button"
              (click)="deselectAllImages()"
              *ngIf="selectedAdminImages.length > 0"
              pTooltip="{{ 'common.unselectAll' | translate }}" 
              tooltipPosition="top"
            >
              <i class="pi pi-times-circle"></i>
            </button>

            <button
              class="btn btn__icon--purple"
              type="button"
              (click)="selectAllImages()"
              pTooltip="{{ 'common.selectAll' | translate }}" 
              tooltipPosition="top"
              [disabled]="selectedAdminImages.length > 0 || images?.length === 0"
              [class.disabled]="selectedAdminImages.length > 0 || images?.length === 0"
              *ngIf="selectedAdminImages.length !== images?.length"
            >
              <i class="pi pi-check-circle"></i>
            </button>
          </ng-container>

          <button
            class="btn btn__icon--red"
            type="button"
            (click)="deleteSelected()"
            pTooltip="{{ 'common.deleteSelected' | translate }}" 
            tooltipPosition="top"
            [disabled]="selectedAdminImages.length === 0"
            [class.disabled]="selectedAdminImages.length === 0"
            *permit="'BO'"
          >
            <i class="pi pi-trash"></i>
          </button>
      
          <button
            class="btn btn__icon--orange"
            type="button"
            (click)="disableSelected()"
            pTooltip="{{ 'common.disableSelected' | translate }}" 
            tooltipPosition="top"
            [disabled]="selectedAdminImages.length === 0"
            [class.disabled]="selectedAdminImages.length === 0"
            *permit="'BO'"
          >
            <i class="pi pi-ban"></i>
          </button>
    
          <button
            class="btn btn__icon--green"
            type="button"
            (click)="enableSelected()"
            pTooltip="{{ 'common.enableSelected' | translate }}" 
            tooltipPosition="top"
            [disabled]="selectedAdminImages.length === 0"
            [class.disabled]="selectedAdminImages.length === 0"
            *permit="'BO'"
          >
            <i class="pi pi-check"></i>
          </button>
          <!-- ADMIN BUTTONS -->
        </ng-container>
      </div>
    </div>
  
    <p class="album__empty" *ngIf="showSelected && selectedImages.length === 0">
      <img src="../../../../assets//img/svg/no-results.svg" alt="">
      {{ (imageSearch ? 'common.noResults' : 'albums.noImagesSelected') | translate }}
    </p>

    <p class="album__empty" *ngIf="!showSelected && images?.length === 0">
      <img src="../../../../assets//img/svg/empty.svg" *ngIf="!imageSearch">
      <img src="../../../../assets//img/svg/no-results.svg" *ngIf="imageSearch">
      {{ (imageSearch ? 'common.noResults' : 'albums.noImages') | translate }}
    </p>

    <div class="album__images" *ngIf="!showSelected">
      <div 
        class="album__images--image"
        *ngFor="let image of imagesToDisplay; let i = index"
      >
        <app-single-image
          [image]="image"
          [imageDisabled]="image.disabled"
          [selectedImages]="selectedImages"
          [selectedAdminImages]="selectedAdminImages"
          [albumId]="albumId"
          (onImageClick)="onToggleOverview($event, imagesToDisplay)"
          (onDelete)="deleteImage($event, i)"
          (onSelect)="onImageSelect($event)"
          [isAdmin]="isAdmin"
        ></app-single-image>
      </div>
    </div>

    <div class="w-full flex justify-center align-center mt-2" 
      *ngIf="!showSelected && imagesToDisplay!.length > 0">
      <button 
        pButton
        type="button"
        class="btn btn__main"
        (click)="seeMoreImages()"
        [disabled]="leftImagesToDisplay?.length === 0"
      >
        {{ 'common.seeAll' | translate }}
      </button>
    </div>

    <ng-container *ngIf="showSelected && isAdmin">
      <div class="w-full">
        <p-table
          [value]="selectedImages"
          [rows]="10"
          [paginator]="false"
        >
          <ng-template pTemplate="header">
            <tr>
              <th></th>
              <th>
                {{ 'properties.image' | translate }}
              </th>
              <th></th>
            </tr>
          </ng-template>
    
          <ng-template pTemplate="emptymessage">
            <tr>
              <td colspan="3" class="no-results">{{ 'common.noResults' | translate }}</td>
            </tr>
          </ng-template>
      
          <ng-template pTemplate="body" let-image let-index="rowIndex">
            <tr>
              <td>
                {{ index + 1 }}
              </td>
              <td>
                <p>{{ image.name }}</p>
              </td>
              <td></td>
            </tr>
          </ng-template>
        </p-table>
      </div>
    </ng-container>

    <!-- NOT ADMIN SECTION -->
    <div class="album__images" *ngIf="showSelected && !isAdmin">
      <ng-container *ngIf="!isAdmin">
        <div 
          class="album__images--image"
          *ngFor="let image of selectedImages; let i = index"
        >
          <app-single-image
            [image]="image"
            [imageDisabled]="image.disabled"
            [selectedImages]="selectedImages"
            [albumId]="albumId"
            (onImageClick)="onToggleOverview($event, images)"
            (onDelete)="deleteImage($event, i)"
            (onSelect)="onImageSelect($event)"
            [isAdmin]="isAdmin"
          ></app-single-image>
        </div>
      </ng-container>

    </div>
    <!-- NOT ADMIN SECTION -->
  </div>
</ng-template>

<p-confirmDialog 
  [key]="'deleteImage'"
  header="{{ 'common.confirmation' | translate }}" 
  [style]="{ width: '50%',  padding: '1rem' }"  
></p-confirmDialog>

<p-confirmDialog 
  [key]="'disableImages'"
  header="{{ 'common.confirmation' | translate }}" 
  [style]="{ width: '50%',  padding: '1rem' }"  
></p-confirmDialog>

<p-confirmDialog 
  [key]="'enableImages'"
  header="{{ 'common.confirmation' | translate }}" 
  [style]="{ width: '50%',  padding: '1rem' }"  
></p-confirmDialog>

<p-overlayPanel #searchOp>
  <div class="album__top--search" >
    <input 
      type="text" 
      pInputText
      class="mb-2"
      placeholder="{{ 'common.searchName' | translate}}"
      [(ngModel)]="imageSearch"
      (keydown.enter)="filter(); searchOp.toggle($event)"
    >
    
    <div class="container__flex gap-1 justify-center">
      <button 
        pButton
        type="button"
        class="btn btn__icon--orange px-1"
        (click)="filter(); searchOp.toggle($event)"
      >
        <i class="pi pi-filter"></i>
        {{ 'common.search' | translate }}
      </button>

      <button 
        pButton
        type="button"
        class="btn btn__icon--dark px-1"
        (click)="clearFilter(); searchOp.toggle($event)"
      >
        <i class="pi pi-filter-slash"></i>
        Reset
      </button>
    </div>
  </div>
</p-overlayPanel>
