<p-tabView 
  [(activeIndex)]="tabsIndex" 
  (onChange)="onTabChange()">
  <p-tabPanel header="{{ 'common.all' | translate }}">
    <ng-container *ngIf="tabsIndex === 0">
      <ng-container 
        *ngTemplateOutlet="albumImages"
      ></ng-container>
    </ng-container>
  </p-tabPanel>

  <p-tabPanel header="{{ 'common.selected' | translate }}">
    <ng-container *ngIf="tabsIndex === 1">
      <ng-container 
        *ngTemplateOutlet="albumImages"
      ></ng-container>
    </ng-container>
  </p-tabPanel>
</p-tabView>

<ng-template #albumImages>
  <div class="album">
    <div class="album__top">
      <div class="album__top--search">
        <input 
          type="text" 
          pInputText
          class=""
          placeholder="{{ 'common.searchName' | translate}}"
          [(ngModel)]="imageSearch"
          (keydown.enter)="filter()"
          [readOnly]="images?.length === 0"
        >
        <i class="pi pi-search icon-search"></i>
      </div>
  
      <div class="album__top--actions">
        <button
          class="btn btn__icon--blue"
          type="button"
          (click)="deselectAllImages()"
          *ngIf="selectedImages.length > 0"
          pTooltip="{{ 'common.unselectAll' | translate }}" 
          tooltipPosition="top"
        >
          <i class="pi pi-times-circle"></i>
        </button>

        <ng-container *ngIf="!showSelected">
          <button
            class="btn btn__icon--purple"
            type="button"
            (click)="selectAllImages()"
            pTooltip="{{ 'common.selectAll' | translate }}" 
            tooltipPosition="top"
            [disabled]="selectedImages.length > 0 || images?.length === 0"
            [class.disabled]="selectedImages.length > 0 || images?.length === 0"
          >
            <i class="pi pi-check-circle"></i>
          </button>

          <button
            class="btn btn__icon--red"
            type="button"
            (click)="deleteSelected()"
            pTooltip="{{ 'common.deleteSelected' | translate }}" 
            tooltipPosition="top"
            [disabled]="selectedImages.length === 0"
            [class.disabled]="selectedImages.length === 0"
            *permit="'BO'"
          >
            <i class="pi pi-trash"></i>
          </button>
      
          <button
            class="btn btn__icon--orange"
            type="button"
            (click)="disableSelected()"
            pTooltip="{{ 'common.disableSelected' | translate }}" 
            tooltipPosition="top"
            [disabled]="selectedImages.length === 0"
            [class.disabled]="selectedImages.length === 0"
            *permit="'BO'"
          >
            <i class="pi pi-ban"></i>
          </button>
    
          <button
            class="btn btn__icon--green"
            type="button"
            (click)="enableSelected()"
            pTooltip="{{ 'common.enableSelected' | translate }}" 
            tooltipPosition="top"
            [disabled]="selectedImages.length === 0"
            [class.disabled]="selectedImages.length === 0"
            *permit="'BO'"
          >
            <i class="pi pi-check"></i>
          </button>
        </ng-container>
      </div>
    </div>
  
    <p class="album__empty" *ngIf="images?.length === 0">
      <img src="../../../../assets//img/empty.jpg" alt="">
      {{ 'albums.noImages' | translate }}
    </p>
  
    <div class="album__images" *ngIf="!showSelected">
      <div 
        class="album__images--image"
        *ngFor="let image of images; let i = index"
      >
        <app-single-image
          [image]="image"
          [imageDisabled]="image.disabled"
          [selectedImages]="selectedImages"
          (onImageClick)="onToggleOverview($event, images)"
          (onDelete)="deleteImage($event, i)"
          (onSelect)="onImageSelect($event)"
        ></app-single-image>
      </div>
    </div>

    <div class="album__images" *ngIf="showSelected">
      <div 
        class="album__images--image"
        *ngFor="let image of selectedImages; let i = index"
      >
        <app-single-image
          [image]="image"
          [imageDisabled]="image.disabled"
          [selectedImages]="selectedImages"
          (onImageClick)="onToggleOverview($event, images)"
          (onDelete)="deleteImage($event, i)"
          (onSelect)="onImageSelect($event)"
        ></app-single-image>
      </div>
    </div>
  </div>
</ng-template>

<p-confirmDialog 
  [key]="'deleteImage'"
  header="{{ 'common.confirmation' | translate }}" 
  [style]="{ width: '50%',  padding: '1rem' }"  
></p-confirmDialog>

<p-confirmDialog 
  [key]="'disableImages'"
  header="{{ 'common.confirmation' | translate }}" 
  [style]="{ width: '50%',  padding: '1rem' }"  
></p-confirmDialog>

<p-confirmDialog 
  [key]="'enableImages'"
  header="{{ 'common.confirmation' | translate }}" 
  [style]="{ width: '50%',  padding: '1rem' }"  
></p-confirmDialog>
