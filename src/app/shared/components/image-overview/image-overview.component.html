@if (imageOverviewState.overviewState$ | async; as state) {
  @if (state.showOverview) {
    <div class="modal">
      <div
        class="modal__bg"
        (click)="imageOverviewState.closeOverview()"
      ></div>

      <button
        type="button"
        class="modal__close"
        aria-label="Close"
        (click)="imageOverviewState.closeOverview()"
        >
        <i class="pi pi-times"></i>
      </button>

      <div class="modal__img" (click)="imageOverviewState.closeOverview()">
        <div class="modal__img--image" (click)="$event.stopPropagation()">
          <img [src]="state.overviewImage" alt="">
        </div>
      </div>

      @if (state.overviewImages.length > 1) {
        <button
          type="button"
          class="modal__nav modal__nav--prev"
          aria-label="Previous"
          (click)="imageOverviewState.changeImage('prev')"
          >
          <i class="pi pi-chevron-left"></i>
        </button>
        <button
          type="button"
          class="modal__nav modal__nav--next"
          aria-label="Next"
          (click)="imageOverviewState.changeImage('next')"
          >
          <i class="pi pi-chevron-right"></i>
        </button>
      }
    </div>
  }
}
