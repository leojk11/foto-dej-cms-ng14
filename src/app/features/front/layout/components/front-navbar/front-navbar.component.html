<div class="frontnav" *ngIf="frontConfigurationState.confState$ | async as state">
  <div class="frontnav__brand">
    <div class="frontnav__brand--logo-wrapper">
      <img 
        [src]="state.imageUrl + state.configuration.logo"
        alt="" 
        class="frontnav__brand--logo-wrapper--img"
      >
    </div>
  </div>

  <ng-container *ngIf="(isMobile$ | async); else notMobile">
    <p-menu 
      #menu [popup]="true" 
      [model]="menuItems" 
      styleClass="frontnav__menu"
    ></p-menu>

    <button 
      type="button" 
      class="btn btn__main--icon"
      pButton 
      label="Show" 
      (click)="menu.toggle($event)"
    >
      <i class="pi pi-list"></i>
    </button>
  </ng-container>

  <ng-template #notMobile>
    <div class="frontnav__actions">
      <ng-container *ngIf="isAuthenticated">
        <a 
          class="frontnav__actions__link"
          routerLink="/client/albums"
          routerLinkActive="active"
        >
          {{ 'common.albums' | translate }}
        </a>
        <!-- <a 
          class="frontnav__actions__link"
          routerLink="/client/profile"
          routerLinkActive="active"
        >
          {{ 'common.profile' | translate }}
        </a> -->
      </ng-container>
  
      <ng-container *ngIf="!isAuthenticated">
        <div class="frontnav__actions__middle">
          <a 
            class="frontnav__actions__link" 
            (click)="goToElement.emit('collaboration')">
            {{ 'common.contact' | translate }}
          </a>

          <a 
            class="frontnav__actions__link" 
            (click)="goToElement.emit('slider')">
            {{ 'common.gallery' | translate }}
          </a>
        </div>
      </ng-container>
    </div>
  
    <div class="container__flex gap-2">
      <app-lang-change></app-lang-change>
  
      <button 
        *ngIf="isAuthenticated"
        pButton
        type="button"
        class="btn btn__main btn__main--icon shadow-sm fw-600"
        [pTooltip]="'common.signOut' | translate"
        tooltipPosition="bottom"
        (click)="logout()"
      >
        <i class="pi pi-sign-out"></i>
      </button>
  
      <button 
        *ngIf="!isAuthenticated"
        pButton
        type="button"
        class="btn btn__main"
        routerLink="/auth/client"
        [pTooltip]="'common.signIn' | translate"
        tooltipPosition="bottom"
      >
        {{ 'common.signIn' | translate }}
      </button>
    </div>
  </ng-template>
</div>
