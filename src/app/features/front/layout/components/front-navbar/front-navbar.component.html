<div class="frontnav" *ngIf="frontConfigurationState.confState$ | async as state">
  <div class="frontnav__brand">
    <div class="frontnav__brand--logo-wrapper">
      <img 
        [src]="state.imageUrl + state.configuration.logo"
        alt="" 
        class="frontnav__brand--logo-wrapper--img"
      >
    </div>
    <!-- <span class="frontnav__brand--name"> 
      {{ 'common.name' | translate }}
    </span> -->
  </div>

  <div class="frontnav__actions">
    <a 
      class="frontnav__actions__link"
      routerLink="albums"
      routerLinkActive="active"
    >
      Албуми
    </a>
    <a class="frontnav__actions__link" >
      Профил
    </a>

  </div>
  <div class="container__flex gap-2">
    <div class="container__flex gap-1" >
      <span (click)="changeLang()" class="cp">
        <i class="pi pi-globe text-xl"></i>
      </span>
      <div 
        class="lang-wrapper" 
        *ngIf="selectedLang === 'mk'"
      >
        <span class="front-lang">
          {{ 'common.mk' | translate }}
        </span>
      </div>
      <div
        class="lang-wrapper" 
        *ngIf="selectedLang === 'en'"
      >
        <span class="front-lang ">
          {{ 'common.en' | translate }}
        </span>
      </div>
    </div>

    <button 
      pButton
      type="button"
      class="btn btn__main btn__main--icon shadow-sm fw-600"
      (click)="logout()"
    >
      <i class="pi pi-sign-out"></i>
    </button>

    
  </div>
</div>
