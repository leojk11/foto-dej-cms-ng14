<div class="front" *ngIf="frontConfigState.confState$ | async as state">
  <app-front-navbar
    [imageUrl]="state.imageUrl + state.configuration.logo"
  ></app-front-navbar>

  <div class="container">
    <router-outlet></router-outlet>
  </div>

  <app-footer
    [configuration]="state.configuration"
  ></app-footer>

  <app-image-overview></app-image-overview>
</div>
