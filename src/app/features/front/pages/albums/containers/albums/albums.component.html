<div class="albums px-0" *ngIf="store.state$ | async as state">
  <!-- <app-album
    [images]="state.images?.images"
    [selectedImages]="state.selectedImages"
    [isAdmin]="true"
    [isSelect]="false"
    (onImageSearch)="filter($event)"
    (onSelect)="onImageSelect($event)"
  ></app-album> -->
  <div *ngIf="!state.loading" class="albums__content bg-none mh-60 align-start p-0">
    <div
      class="single-album-wrapper"
      *ngFor="let album of state.list"
    >
      <app-single-album
        [album]="album"
      ></app-single-album>
    </div>

  </div>

  <p-paginator 
    *ngIf="state.total > state.params.take"
    [rows]="state.params.take"
    [totalRecords]="state.total"
    (onPageChange)="onPageChange($event)"
  ></p-paginator>

  <div class="page__loading" *ngIf="state.loading">
    <app-spinner></app-spinner>
  </div>
</div>
