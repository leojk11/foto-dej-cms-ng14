<div class="gallery" *ngIf="frontConfigurationState.confState$ | async as state">
  <div class="gallery__header">
    <app-front-navbar
      (goToElement)="goToElement($event, -100)"
      [gallery]="true"
    ></app-front-navbar>
  </div>

  <div class="gallery__images">
    <div class="gallery__images__image" *ngFor="let image of imagesToDisplay">
      <!-- <img [src]="imagesUrl + image" [alt]="image" class="cp"
        (click)="toggleOverview($event, imagesToDisplay)"> -->
      <front-single-image [imagesUrl]="imagesUrl" [image]="image" 
        [imagesToDisplay]="imagesToDisplay"></front-single-image>
    </div>
  </div>

  <div class="w-full flex justify-center align-center mt-2"
    [style]="{ 'margin-bottom': '150px' }">
    <button 
      pButton
      type="button"
      class="btn btn__main"
      (click)="seeMoreImages()"
      [disabled]="leftImagesToDisplay?.length === 0 || imagesToDisplay!.length === 0"
    >
      {{ 'common.seeAll' | translate }}
    </button>
  </div>

  <app-footer
    [configuration]="state.configuration"
  ></app-footer>
</div>

<app-image-overview></app-image-overview>
