<div class="outer-slider-wrapper">
  <div class="main-slider-container">
    <div class="slider-container">
      @for (image of promoImages; track image; let i = $index) {
        <div
          class="slider-item"
        [ngClass]="{
          'selected': i === selectedIndex,
          'prev': i === selectedIndex - 1,
          'next': i === selectedIndex + 1,
          'hide-left': i < selectedIndex - 1,
          'hide-right': i > selectedIndex + 1
        }">
          <img [src]="imagesUrl + image" class="slider-img" alt=""
            draggable="false"
            (click)="onImageClick(i)"
            (pointerdown)="onPanStart($event)"
            (pointermove)="onPanMove($event, i)"
            (pointerup)="onPanEnd()"
            (pointercancel)="onPanEnd()">
          </div>
        }
      </div>
    </div>

    @if (promoImages.length > 1) {
      <div class="slider-controls">
        <button type="button" class="slider-arrow" aria-label="Previous"
          [disabled]="selectedIndex === 0" (click)="select(selectedIndex - 1)">
          <i class="pi pi-chevron-left"></i>
        </button>

        <div class="slider-dots">
          @for (image of promoImages; track image; let i = $index) {
            <button type="button" [class.active]="i === selectedIndex" [attr.aria-label]="'Image ' + (i + 1)"
              (click)="select(i)"></button>
          }
        </div>

        <button type="button" class="slider-arrow" aria-label="Next"
          [disabled]="selectedIndex === promoImages.length - 1" (click)="select(selectedIndex + 1)">
          <i class="pi pi-chevron-right"></i>
        </button>
      </div>
    }
  </div>
