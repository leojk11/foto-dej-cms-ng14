<div class="outer-slider-wrapper">
  <div class="main-slider-container">
    <div class="slider-container">
      <div 
        class="slider-item" 
        *ngFor="let image of promoImages; let i = index"
        [ngClass]="{
          'selected': i === selectedIndex,
          'prev': i === selectedIndex - 1,
          'next': i === selectedIndex + 1,
          'hide-left': i < selectedIndex - 1,
          'hide-right': i > selectedIndex + 1
        }">
        <img [src]="imagesUrl + image" class="slider-img"
          (panright)="showPrev(i)"
          (panleft)="showNext(i)">
      </div>
    </div>
  </div>
</div>
