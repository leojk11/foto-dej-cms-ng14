<div class="home" *ngIf="frontConfigurationState.confState$ | async as state">
  <div class="home__header">
    <div class="home__header--image">
      <img [src]="state.imageUrl + state.configuration.main_image" alt="main_image">
      <div class="after"></div>
    </div>
    
    <app-front-navbar
      (goToElement)="goToElement($event, -100)"
    ></app-front-navbar>

    <div class="home__hero">
      <div class="home__hero--title">
        {{ mainTitle }}
      </div>
      <div class="home__hero--text">
        {{ secondTitle }}
      </div>

      <div class="home__hero--buttons">
        <button 
          pButton
          type="button"
          routerLink="/auth/client"
          class="btn btn__main"
        >
          {{ 'common.signIn' | translate }}
        </button>

        <button 
          pButton
          type="button"
          class="btn btn__main--outline"
          (click)="goToElement(collaboration, -100)"
        >
          {{ 'home.collaboration' | translate }}
        </button>
      </div>
    </div>

    <div class="home__arrow" (click)="goToElement(slider, -100)">
      <img src="../../../../../../../assets/img/hero-arrow.svg" alt="">
    </div>
  </div>

  <div class="home__slider" #slider>
    <app-slider
      [promoImages]="state.configuration.promo_images"
      [imageUrl]="state.imageUrl"
    ></app-slider>
  </div>

  <div class="home__video">
    <video 
      *ngIf="configuration.promo_video" 
      controls 
      width="100%" 
      height="100%"
    >
      <source [src]="videoUrl + configuration.promo_video">
    </video>
  </div>

  <div class="home__contact" #collaboration>
    <p class="home__contact--title">
      {{ 'home.contactFormLabel' | translate }}
    </p>

    <div class="home__contact--form">
      <app-contact-form></app-contact-form>
    </div>
  </div>

  <app-footer
    [configuration]="state.configuration"
  ></app-footer>
</div>
