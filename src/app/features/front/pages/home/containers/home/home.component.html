<div class="home">
  <div class="home__header">
    <div class="home__header--image">
      <img src="../../../../../../../assets/img/hero.png" alt="">
      <div class="after"></div>
    </div>
    
    <div class="home__navbar">
      <div class="home__navbar--brand">
        <div class="home__navbar--brand--logo-wrapper">
          <img 
            src="../../../../../../assets/img/logo.png" 
            alt="" 
            class="home__navbar--brand--logo-wrapper--img"
          >
        </div>
        <span class="home__navbar--brand--name"> 
          {{ 'common.name' | translate }}
        </span>
      </div>

      <div class="home__navbar--actions">
        <div class="home__navbar--actions__link">
          {{ 'common.contact' | translate }}
        </div>
        <div class="home__navbar--actions__link">
          {{ 'common.gallery' | translate }}
        </div>

        <button class="btn btn__main">
          {{ 'common.signIn' | translate }}
        </button>
      </div>
    </div>

    <div class="home__hero">
      <div class="home__hero--title">
        {{ 'home.heroTitle' | translate }}
      </div>
      <div class="home__hero--text">
        {{ 'home.heroText' | translate }}
      </div>

      <div class="home__hero--buttons">
      </div>
    </div>
  </div>
</div>
