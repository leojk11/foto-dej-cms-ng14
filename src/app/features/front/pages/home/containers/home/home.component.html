<div class="home">
  <div class="home__header">
    <div class="home__header--image">
      <img src="../../../../../../../assets/img/hero.png" alt="">
      <div class="after"></div>
    </div>
    
    <div class="home__navbar">
      <div class="home__navbar--brand">
        <div class="home__navbar--brand--logo-wrapper">
          <img 
            src="../../../../../../assets/img/logo.png" 
            alt="" 
            class="home__navbar--brand--logo-wrapper--img"
          >
        </div>
        <span class="home__navbar--brand--name"> 
          {{ 'common.name' | translate }}
        </span>
      </div>

      <div class="home__navbar--actions">
        <div class="home__navbar--actions__link">
          {{ 'common.contact' | translate }}
        </div>
        <div class="home__navbar--actions__link">
          {{ 'common.gallery' | translate }}
        </div>

        <button 
          pButton
          type="button"
          routerLink="/auth/user"
          class="btn btn__main"
        >
          {{ 'common.signIn' | translate }}
        </button>
      </div>
    </div>

    <div class="home__hero">
      <div class="home__hero--title">
        {{ 'home.heroTitle' | translate }}
      </div>
      <div class="home__hero--text">
        {{ 'home.heroText' | translate }}
      </div>

      <div class="home__hero--buttons">
        <button 
          pButton
          type="button"
          routerLink="/auth/user"
          class="btn btn__main"
        >
          {{ 'common.signIn' | translate }}
        </button>

        <button 
          pButton
          type="button"
          class="btn btn__main--outline"
        >
          {{ 'home.collaboration' | translate }}
        </button>
      </div>
    </div>
  </div>

  <div class="home__slider">
    <app-slider></app-slider>
  </div>

  <div class="home__video">
    <video 
      *ngIf="configuration.promo_video" 
      controls 
      width="100%" 
      height="677px"
    >
      <source [src]="videoUrl + configuration.promo_video">
    </video>
  </div>

  <div class="home__contact">
    <p class="home__contact--title">
      {{ 'messages.contactInfo' | translate }}
    </p>

    <div class="home__contact--form">
      <app-contact-form></app-contact-form>
    </div>
  </div>

  <app-home-footer
    [configuration]="configuration"
  ></app-home-footer>
</div>
