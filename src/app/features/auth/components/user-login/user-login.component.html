<div class="page-login">
  <div class="app-version">{{ appVersion }}</div>
  <div class="page-login__image">
    <img src="../../../../../assets/img/client-login.svg" alt="">
  </div>
  <div class="page-login__content container__flex-col">
    <div class="page-login__content--logo-wrapper">
      <img src="../../../../../assets/img/logo.png" alt="" class="logo">
    </div>
    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <div class="container__flex-col gap-2">
        <div class="form-field wrap w-full">
          <label 
            class="form-field__label"
            for="email"
          >
            {{ 'login.email' | translate }}:
          </label>
          <input 
            type="email"
            pInputText
            id="email"
            formControlName="email"
            placeholder="example@gmail.com"
          >
        </div>
        <div class="form-field wrap w-full">
          <label 
            class="form-field__label"
            for="password"
          >
            {{ 'login.password' | translate }}:
          </label>
          <div class="container__flex gap-1 relative w-full">
            <input 
              type="password" 
              pInputText
              id="password"
              #password
              formControlName="password"
              placeholder="*********"
            >
            <i 
              class="pi btn-icon btn-icon--green"
              [ngClass]="showPass ? 'pi-eye-slash' : 'pi-eye'" 
              #seePass 
              (click)="viewPassword()"
            ></i>
          </div>
        </div>
        <a class="forgot-password"> 
          {{ 'login.forgotPassword' | translate }}
        </a>

        <div class="container__flex justify-center" *ngIf="!loading">
          <button 
            class="btn btn__green form-field__btn"
            type="submit"
          >
            {{ 'login.login' | translate }}
          </button>
        </div>

        <div class="page-login__loading" *ngIf="loading">
          <app-spinner></app-spinner>
        </div>
      </div>
    </form>

    <div class="container__flex justify-center gap-2 mt-auto">
      <div class="lang-wrapper" [class.lang-selected]="selectedLang === 'mk'">
        <span 
          class="lang-text"
          (click)="changeLang('mk')"
        >
          MK
        </span>
      </div>
      <div class="lang-wrapper" [class.lang-selected]="selectedLang === 'en'">
        <span 
          class="lang-text"
          (click)="changeLang('en')"
        >
          EN
        </span>
      </div>
    </div>
  </div>
  
</div>
