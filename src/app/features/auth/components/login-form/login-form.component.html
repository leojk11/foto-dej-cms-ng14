<div class="login__content">
  <div 
    *ngIf="frontConfigState.confState$ | async as config"
    class="login__content--logo-wrapper" 
  >
    <img 
      [src]="config.imageUrl + config.configuration.logo" 
      class="logo">
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
    <div class="container__flex-col gap-2">
      <div class="form-field wrap w-full">
        <label 
          class="form-field__label"
          for="email"
        >
          {{ 'login.email' | translate }}:
        </label>

        <input 
          type="email"
          pInputText
          id="email"
          formControlName="email"
          placeholder="example@gmail.com"
        >
      </div>
      
      <div class="form-field wrap w-full">
        <label 
          class="form-field__label"
          for="password"
        >
          {{ 'login.password' | translate }}:
        </label>

        <p-password
          formControlName="password"
          placeholder="**********"
          [toggleMask]="true"
          [feedback]="false"
        ></p-password>
      </div>

      <!-- <a class="forgot-password ml-auto" >  
        {{ 'login.forgotPassword' | translate }}
      </a> -->

      <div class="container__flex justify-center" *ngIf="!loading">
        <button 
          class="btn btn__main"
          type="submit"
          [disabled]="loading"
        >
          {{ 'login.login' | translate }}
        </button>
      </div>
    </div>
  </form>

  <!-- <app-lang-change></app-lang-change> -->
</div>
