<div class="w-full p-3">
  <form class="mt-2" [formGroup]="form" (ngSubmit)="handleSubmit()">
    <div class="container__flex gap-3" >
      <div class="form-field w-full">
        <label class="form-field__label">
          {{ 'properties.password' | translate }}:
        </label>

        <input
          type="text"
          pInputText
          class="w-full"
          formControlName="password"
          placeholder="{{ 'properties.password' | translate }}..."
        >
      </div>
      <div class="form-field w-full">
        <label class="form-field__label">
          {{ 'properties.repeatPassword' | translate }}:
        </label>

        <input
          type="text"
          pInputText
          class="w-full"
          formControlName="repeat_password"
          placeholder="{{ 'properties.repeatPassword' | translate }}..."
        >
      </div>

      <div class="w-full container__flex justify-center mt-1">
        <button
          class="btn btn__main"
          type="submit"
          [disabled]="form.invalid"
          >
          
          {{ 'common.save' | translate }}
        </button>
      </div>
    </div>
  </form>
</div>
