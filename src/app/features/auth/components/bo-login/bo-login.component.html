<div class="page-login-bo">
  <div class="app-version">{{ appVersion }}</div>
  <div class="page-login-bo__image">
    <img src="../../../../../assets/img/admin-login.svg" alt="">
  </div>
  <div class="page-login-bo__content container__flex-col">
    <div class="page-login-bo__content--logo-wrapper">
      <img src="../../../../../assets/img/logo.png" alt="" class="logo">
    </div>
    <form [formGroup]="loginForm" (ngSubmit)="loginAdmin()">
      <div class="container__flex-col gap-2">
        <div class="form-field wrap">
          <label 
            class="form-field__label"
            for="email"
          >
            {{ 'login.email' | translate }}:
          </label>
          <input 
            type="email"
            pInputText
            id="email"
            formControlName="email"
            placeholder="example@gmail.com"
          >
        </div>
        <div class="form-field wrap w-full">
          <label 
            class="form-field__label"
            for="password"
          >
          {{ 'login.password' | translate }}:
          </label>
          <div class=" relative w-full">
            <input 
              type="password" 
              pInputText
              id="password"
              #password
              formControlName="password"
              placeholder="*********"
            >
            <span 
              class="material-symbols-outlined btn-icon" 
              #seePass 
              (click)="viewPassword()"
            >
              visibility
            </span>
          </div>
        </div>

        <a class="forgot-password ml-auto"> 
          {{ 'login.forgotPassword' | translate }}
        </a>

        <div class="form-field justify-center" *ngIf="!loading">
          <button 
            class="btn btn__brown form-field__btn"
            type="submit"
            [disabled]="loading"
          >
            {{ 'login.login' | translate }}
          </button>
        </div>

        <div class="page-login__loading" *ngIf="loading">
          <app-spinner></app-spinner>
        </div>
      </div>
    </form>

    <div class="container__flex justify-center gap-1 mt-3">
      <div class="lang-wrapper" [class.lang-selected]="selectedLang === 'mk'">
        <!-- <img 
          src="../../../../../assets/img/mk-flag.png" 
          alt="MK" 
          class="lang-img"
          (click)="changeLang('mk')"
        > -->
        <span 
          class="lang-text"
          (click)="changeLang('mk')"
        >
          {{ 'common.mk' | translate }}
        </span>
      </div>
      <div class="lang-wrapper" [class.lang-selected]="selectedLang === 'en'">
        <!-- <img 
          src="../../../../../assets/img/uk-flag.png" 
          alt="EN" 
          class="lang-img"
          (click)="changeLang('en')"
        > -->
        <span 
          class="lang-text"
          (click)="changeLang('en')"
        >
          {{ 'common.en' | translate }}
        </span>
      </div>
    </div>
  </div>
  
</div>
