<div class="navbar">
  <div class="flex align-center gap-2">
    <div 
      class="toggle" 
      (click)="toggleSidebar.emit(); showToggle = true"
    >
      <i class="pi pi-bars"></i>
    </div>
    <div
      *ngIf="adminLayoutService.adminLayoutState$ | async as state"
    >
      <!-- <button
        class="btn btn__icon btn__icon--dark shadow-small border-none"
        (click)="location.back()"
      >
        <span class="material-symbols-outlined">arrow_back_ios_new</span>
      </button> -->
      <div class="page-header__title">
        {{ state.pageTitle | translate }}
        <span *ngIf="state.detail">  &#8250;  {{ state.detail | translate }} </span>
      </div>
    </div>
  </div>

  <div class="text">
    {{ appVersion }}
  </div>

  <div class="container__flex">
    <div *ngIf="authService.user$ | async as user">
      <p class="c-white text-lg">
        {{ user.firstname }} {{ user.lastname }}
      </p>
    </div>
    <div class="navbar__buttons" (click)="logout()">
      <button class="btn btn__icon shadow-small">
        <span class="material-symbols-outlined">
          logout
        </span>
      </button>
    </div>
  </div>
</div>
