<div class="navbar">
  <div class="flex align-center gap-2">
    <div 
      class="toggle" 
      (click)="toggleSidebar.emit(); showToggle = true"
    >
      <i class="pi pi-bars"></i>
    </div>

    <div
      *ngIf="adminLayoutService.adminLayoutState$ | async as state"
    >
      <div class="page-header__title">
        {{ state.pageTitle | translate }}

        <span *ngIf="state.detail">  
          &#8250;  {{ state.detail | translate }} 
        </span>
      </div>
    </div>
  </div>

  <ng-container *ngIf="!isMobile">
    <div class="text">
      {{ appVersion }}
    </div>
  
    <div class="container__flex gap-3">
      <button 
        type="button"
        pButton
        class="btn btn__icon"
        (click)="op.toggle($event)"
      >
        <i class="pi pi-bell"></i>
      </button>

      <div *ngIf="authService.user$ | async as user">
        <p class="c-white text-lg">
          {{ user.firstname }} {{ user.lastname }}
        </p>
      </div>

      <button 
        type="button"
        pButton
        class="btn btn__main btn__sm shadow-small px-1"
        (click)="logout()"
      >
        <i class="pi pi-sign-out"></i>
        {{ 'common.signOut' | translate }}
      </button>
    </div>
  </ng-container>
</div>

<p-overlayPanel #op>
  <div class="notifications-panel" >
    <div class="notifications-panel__top">
      <p class="notifications-panel__top--title">
        {{ 'common.notifications' | translate }}
      </p>

      <p 
        class="notifications-panel__top--seeAll"
        routerLink="/bo/notifications"
        (click)="op.toggle($event)"
      >
        {{ 'common.seeAll' | translate }}
      </p>
    </div>

    <div class="separator mb-1"></div>

    <ng-container *ngIf="notificationStore.state$ | async as notifState">
      <div 
        *ngFor="let notification of notifState.notifications"
        class="notifications-panel__list"
      >
        <app-notification
          [notification]="notification"
        ></app-notification>
      </div>
    </ng-container>

  </div>
</p-overlayPanel>
