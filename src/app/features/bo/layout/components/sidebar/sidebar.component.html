<div *ngIf="!isMobile">
  <div class="sidebar" [class.hide]="hideSidebar && !isMobile">
    <div>
      <div class="sidebar__brand" *ngIf="frontConfigurationState.confState$ | async as config">
        <div class="sidebar__logo-wrapper">
          <img 
            [src]="config.imageUrl + config.configuration.logo"
            class="sidebar__logo-wrapper--img"
          >
        </div>
      </div>
    
      <ul class="sidebar__list">
        <li 
          class="sidebar__list--item" 
          *ngFor="let item of sidebarItems"
        >
          <a 
            class="sidebar__link" 
            [routerLink]="item.redirectTo"
            [routerLinkActive]="'active-link'"
            *permit="item.perm"
          > 
            <span class="sidebar__link--icon">
              <i [class]="item.icon"></i>
            </span>
            <p class="sidebar__link--title">
              {{ item.title | translate }}
            </p>
          </a>
        </li>
      </ul>
        
    </div>
  
    <div class="container__flex gap-1 justify-center">
      <div 
        class="lang-wrapper" 
        [class.lang-selected]="selectedLang === 'mk'"
      >
        <span 
          class="lang-text"
          (click)="changeLang('mk')"
        >
          {{ 'common.mk' | translate }}
        </span>
      </div>
      <div
        class="lang-wrapper" 
        [class.lang-selected]="selectedLang === 'en'"
      >
        <span 
          class="lang-text"
          (click)="changeLang('en')"
        >
          {{ 'common.en' | translate }}
        </span>
      </div>
    </div>
  </div>

</div>

<p-sidebar 
  [(visible)]="isMobile && hideSidebar"
  [style]="{width:'23rem'}"
  (onHide)="onHide.emit()"
>
  <div class="sidebar">
    <div>
      <div class="sidebar__brand">
        <div class="sidebar__logo-wrapper" *ngIf="frontConfigurationState.confState$ | async as config">
          <img 
            [src]="config.imageUrl + config.configuration.logo"
            class="sidebar__logo-wrapper--img"
          >
        </div>
      </div>

      <ng-container *ngIf="authService.user$ | async as user">
        <div class="sidebar__user">
          <i class="pi pi-user"></i>
          <p class="text-lg c-dark">
            {{ user.firstname }} {{ user.lastname }}
          </p>
        </div>
      </ng-container>
    
      <ul class="sidebar__list">
        <li 
          class="sidebar__list--item" 
          *ngFor="let item of sidebarItems"
        >
          <a 
            class="sidebar__link" 
            [routerLink]="item.redirectTo"
            [routerLinkActive]="'active-link'"
            (click)="onHide.emit($event)"
          >
            <span class="sidebar__link--icon">
              <i [class]="item.icon"></i>
            </span>
            <p class="sidebar__link--title">
              {{ item.title | translate }}
            </p>
          </a>
        </li>
      </ul>

      <button 
        class="btn btn__main mx-auto mt-3"
        (click)="authService.boLogout()"
      >
        {{ 'common.signOut' | translate }}
        <!-- <i class="pi pi-sign-out"></i> -->
      </button>
    </div>
  
    <div class="container__flex gap-1 justify-center">
      <div 
        class="lang-wrapper" 
        [class.lang-selected]="selectedLang === 'mk'"
      >
        <span 
          class="lang-text"
          (click)="changeLang('mk')"
        >
          {{ 'common.mk' | translate }}
        </span>
      </div>
      <div
        class="lang-wrapper" 
        [class.lang-selected]="selectedLang === 'en'"
      >
        <span 
          class="lang-text"
          (click)="changeLang('en')"
        >
          {{ 'common.en' | translate }}
        </span>
      </div>
    </div>
  </div>
</p-sidebar>
