<div class="event-card">
  <div class="event-card__date">
    {{ date[2] }} {{ date[1] }}
  </div>

  <div class="event-card__separator"></div>

  <div class="event-card__body">
    <div class="event-card__title">
      {{ event.title }}
    </div>
  
    <div class="event-card__description">
      {{ event.description }}
    </div>
  </div>
</div>
