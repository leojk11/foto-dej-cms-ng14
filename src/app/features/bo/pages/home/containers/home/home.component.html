<div class="dashboard" *ngIf="dashboardStore.state$ | async as state">
  <div class="dashboard__cards">
    <app-dashboard-card
      [data]="state.cardsData.albums"
      [title]="'common.albums' | translate"
      [bg]="'bg-highlight'"
      [route]="'albums'"
    ></app-dashboard-card>

    <app-dashboard-card
      [data]="state.cardsData.clients"
      [title]="'common.clients' | translate"
      [bg]="'bg-purple'"
    ></app-dashboard-card>

    <app-dashboard-card
      [data]="state.cardsData.invites"
      [title]="'common.invites' | translate"
      [bg]="'bg-green'"
    ></app-dashboard-card>

    <app-dashboard-card
      [data]="state.cardsData.requests"
      [title]="'common.requests' | translate"
      [bg]="'bg-orange'"
    ></app-dashboard-card>
  </div>
</div>
