<div class="cfg-field" [formGroup]="form">
  <div class="cfg-field__header">
    <span class="cfg-field__label">{{ label | translate }}</span>
    <button class="btn btn__main" type="button" (click)="addElement()">
      <i class="pi pi-plus"></i>
      {{ 'common.add' | translate }}
    </button>
  </div>

  <div class="cfg-field__list" [formArrayName]="id">
    @for (control of elements.controls; track control; let i = $index) {
      <div class="cfg-field__row">
        <input
          type="text"
          placeholder="{{ placeholder | translate | lowercase }}..."
          [formControlName]="i"
          pInputText>
        @if (preview) {
          <button
            class="btn btn__icon--blue"
            type="button"
            pTooltip="{{ 'common.preview' | translate }}"
            tooltipPosition="top"
            [disabled]="!control.value"
            [class.disabled]="!control.value"
            (click)="togglePreview(i)">
            <i class="pi pi-youtube"></i>
          </button>
        }
        <button
          class="btn btn__icon--red"
          type="button"
          pTooltip="{{ 'common.delete' | translate }}"
          tooltipPosition="top"
          (click)="delete(i)">
          <i class="pi pi-trash"></i>
        </button>
      </div>
    }
  </div>
</div>
