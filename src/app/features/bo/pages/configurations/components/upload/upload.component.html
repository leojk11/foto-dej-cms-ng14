<div class="cfg-field">
  <span class="cfg-field__label">{{ label | translate }}</span>

  <label class="cfg-tile__preview" [class.dark]="darkBg" [for]="id">
    @if (selectedFilePreview || preselected) {
      <img
        [src]="selectedFilePreview || imagesUrl + preselected"
        [alt]="label | translate">
    } @else {
      <i class="pi pi-image"></i>
    }
    <span class="cfg-tile__preview__overlay">
      <i class="pi pi-upload"></i>
      {{ 'common.chooseImage' | translate }}
    </span>
  </label>

  <input
    [id]="id"
    type="file"
    class="cfg-tile__input"
    accept="image/*"
    [disabled]="uploadInProgress"
    (change)="selectFile($event)">

  @if (uploadInProgress) {
    <p-progressbar [value]="uploadProgressValue"></p-progressbar>
  }
</div>
