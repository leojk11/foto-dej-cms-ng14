<div class="configuration-wrapper__configuration__item">
  <div class="left">
    <label>{{ label | translate }}</label>
  </div>

  <div class="right">
    <div class="right__top">
      <input #fileUploader [id]="id" 
        type="file" accept="image/*"
        class="upload-input" multiple
        (change)="selectFiles($event)" pInputText>

      <label 
        class="btn btn__main upload-btn" 
        [for]="id">
        <i class="pi pi-plus"></i>
        {{ 'common.chooseImages' | translate }}
      </label>

      <button class="btn btn__main upload-btn" type="button"
        (click)="clearPromoImages()">
        <!-- [disabled]="selectedFiles.length === 0" -->
        {{ 'common.clear' | translate }}
      </button>
    </div>

    <div class="right__bottom">
      <div class="images" *ngIf="selectedFilesPreview.length > 0">
        <div 
          *ngFor="let preview of selectedFilesPreview" 
          class="single-image cp">
          <img [src]="preview">
        </div>
      </div>
      <div class="images" *ngIf="preselected && selectedFilesPreview.length === 0">
        <div 
          *ngFor="let image of preselected" 
          class="single-image cp">
          <img 
            [src]="imagesUrl + image"
            (click)="toggleOverview($event, preselected)">
        </div>
      </div>

      <div
        class="w-full mt-2"
        *ngIf="uploadInPorgress">
        <p-progressBar [value]="uploadProgressValue"></p-progressBar>
      </div>

      <div class="buttons">
        <p class="buttons__label">
          {{ 'common.imagesSizeInfo' | translate }}
        </p>

        <button 
          *ngIf="selectedFiles.length > 0"
          class="btn btn__main upload-btn" 
          type="button"
          (click)="uploadFiles()"
          [disabled]="uploadInPorgress"
        >
          <i class="pi pi_upload"></i>
          {{ 'common.upload' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>

<p-confirmDialog 
  [key]="'clearPromoImages'"
  header="{{ 'common.confirmation' | translate }}" 
  [style]="{ width: '50%',  padding: '1rem' }"
></p-confirmDialog>
