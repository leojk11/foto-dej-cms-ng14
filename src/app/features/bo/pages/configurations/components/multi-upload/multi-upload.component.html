<div class="cfg-field">
  <div class="cfg-field__header">
    <span class="cfg-field__label">{{ label | translate }}</span>
    @if (preselected?.length > 0) {
      <button class="btn btn__red" type="button" (click)="clearPromoImages()">
        <i class="pi pi-trash"></i>
        {{ 'common.clear' | translate }}
      </button>
    }
  </div>

  <div class="cfg-gallery">
    @for (image of visibleImages; track image; let i = $index) {
      <div class="cfg-gallery__item">
        <img [src]="imagesUrl + image" (click)="toggleOverview($event)">
        <button
          class="cfg-gallery__item__delete"
          type="button"
          [attr.aria-label]="'common.delete' | translate"
          (click)="deleteSavedImage(i)">
          <i class="pi pi-trash"></i>
        </button>
      </div>
    }

    <label class="cfg-gallery__add" [for]="id">
      <i class="pi pi-plus"></i>
      {{ 'common.chooseImages' | translate }}
    </label>
  </div>

  <input
    [id]="id"
    type="file"
    class="cfg-gallery__input"
    accept="image/*"
    multiple
    [disabled]="uploadInProgress"
    (change)="selectFiles($event)">

  @if (uploadInProgress) {
    <p-progressbar [value]="uploadProgressValue"></p-progressbar>
  }

  @if (hiddenCount > 0) {
    <div class="cfg-more">
      <button class="btn btn__main" type="button" (click)="seeMoreImages()">
        {{ 'common.seeAll' | translate }} ({{ hiddenCount }})
      </button>
    </div>
  }

  <span class="cfg-field__hint">{{ 'common.imagesSizeInfo' | translate }}</span>
</div>

<p-confirmdialog [dismissableMask]="true"
  [key]="'clearPromoImages'"
  header="{{ 'common.confirmation' | translate }}"
  [style]="{ width: '50%',  padding: '1rem' }"
></p-confirmdialog>
