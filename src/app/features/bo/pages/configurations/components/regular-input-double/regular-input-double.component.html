<div class="cfg-field" [formGroup]="form">
  <label class="cfg-field__label" [for]="controlName">{{ label | translate }}</label>
  <div class="cfg-field__pair">
    <textarea
      rows="2"
      [id]="controlName"
      placeholder="{{ placeholder | translate | lowercase }}..."
      [formControlName]="controlName"
      pInputText></textarea>
    <textarea
      rows="2"
      placeholder="{{ placeholder | translate | lowercase }}..."
      [formControlName]="secondFormControlName"
      pInputText></textarea>
  </div>
  <span class="cfg-field__hint">{{ message | translate }}</span>
</div>
