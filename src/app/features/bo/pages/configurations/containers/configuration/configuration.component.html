<div class="p-2">
  <button
    class="btn btn__icon btn__icon--blue shadow-small border-none"
    (click)="location.back()">
    <i class="pi pi-arrow-left"></i>
  </button>
</div>

<div class="separator"></div>

<form [formGroup]="form" (ngSubmit)="handleSubmit()"
  *ngIf="configurationStore.state$ | async as state">
  <div class="configuration-wrapper" *ngIf="state.configuration">
    <div class="configuration-wrapper__configuration">
      <div class="configuration-wrapper__configuration__multi">
        <app-upload [label]="'properties.logo'" [id]="'logo'" [style]="{ 'width': '100%' }"
          [imagesUrl]="imagesUrl" [preselected]="state.configuration.logo"></app-upload>

        <app-upload [label]="'properties.mainImage'" [id]="'main_image'" [style]="{ 'width': '100%' }"
          [imagesUrl]="imagesUrl" [preselected]="state.configuration.main_image"></app-upload>
      </div>

      <div class="configuration-wrapper__configuration__multi">
        <app-upload [label]="'properties.logoWhite'" [id]="'logo_white'" [style]="{ 'width': '100%' }"
          [darkBg]="true" [imagesUrl]="imagesUrl" [preselected]="state.configuration.logo_white"></app-upload>

        <app-upload [label]="'properties.logoIcon'" [id]="'logo_icon'" [style]="{ 'width': '100%' }"
          [imagesUrl]="imagesUrl" [preselected]="state.configuration.logo_icon"></app-upload>
      </div>

      <app-regular-input-double [form]="form" [controlName]="'main_title'" 
        [label]="'properties.mainTitle'" [placeholder]="'properties.mainTitle'"
        [secondFormControlName]="'main_title_tr'" [message]="'messages.translateMainTitle'"></app-regular-input-double>

      <app-regular-input-double [form]="form" [controlName]="'second_title'" 
        [label]="'properties.secondTitle'" [placeholder]="'properties.secondTitle'"
        [secondFormControlName]="'second_title_tr'" [message]="'messages.translateSecondTitle'"></app-regular-input-double>

      <app-multi-upload [label]="'properties.promoImages'" [id]="'promo_images'"
        [imagesUrl]="imagesUrl" [preselected]="state.configuration.promo_images"></app-multi-upload>

      <app-regular-input [form]="form" [controlName]="'promo_video'" 
        [label]="'properties.promoVideo'" [placeholder]="'properties.promoVideo'"></app-regular-input> 

      <app-regular-input [form]="form" [controlName]="'phone_number'" 
        [label]="'properties.phoneNumber'" [placeholder]="'properties.phoneNumber'"></app-regular-input>

      <app-regular-input [form]="form" [controlName]="'email'" 
        [label]="'properties.email'" [placeholder]="'properties.email'"></app-regular-input>
      
      <app-regular-input [form]="form" [controlName]="'address'" 
        [label]="'properties.address'" [placeholder]="'properties.address'"></app-regular-input>

      <app-regular-input [form]="form" [controlName]="'facebook_link'" 
        [label]="'Facebook'" [placeholder]="'facebook'"></app-regular-input>

      <app-regular-input [form]="form" [controlName]="'insta_link'" 
        [label]="'Instagram'" [placeholder]="'instagram'"></app-regular-input>

      <div class="configuration-wrapper__configuration__buttons">
        <button 
          class="btn btn__red btn__lg" 
          type="button"
          (click)="cancel()">
          {{ 'common.cancel' | translate }}
        </button>
        
        <button 
          class="btn btn__dark btn__lg" 
          type="submit">
          {{ 'common.save' | translate }}
        </button>
      </div>
    </div>
  </div>
</form>
