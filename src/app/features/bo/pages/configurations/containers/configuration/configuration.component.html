<div class="p-2">
  <button
    class="btn btn__icon btn__icon--blue shadow-small border-none"
    (click)="location.back()">
    <i class="pi pi-arrow-left"></i>
  </button>
</div>

<div class="separator"></div>

<form 
  [formGroup]="form" 
  (ngSubmit)="handleSubmit()"
  *ngIf="configurationStore.state$ | async as state">
  <div class="configuration-wrapper" *ngIf="state.configuration">
    <div class="configuration-wrapper__configuration">
      <div class="configuration-wrapper__configuration__multi">
        <app-upload [label]="'properties.logo'" [id]="'logo'" [style]="{ 'width': '100%' }"
          [imagesUrl]="imagesUrl" [preselected]="state.configuration.logo"></app-upload>

        <app-upload [label]="'properties.mainImage'" [id]="'main_image'" [style]="{ 'width': '100%' }"
          [imagesUrl]="imagesUrl" [preselected]="state.configuration.main_image"></app-upload>
      </div>

      <div class="configuration-wrapper__configuration__multi">
        <app-upload [label]="'properties.logoWhite'" [id]="'logo_white'" [style]="{ 'width': '100%' }"
          [darkBg]="true" [imagesUrl]="imagesUrl" [preselected]="state.configuration.logo_white"></app-upload>

        <app-upload [label]="'properties.logoIcon'" [id]="'logo_icon'" [style]="{ 'width': '100%' }"
          [imagesUrl]="imagesUrl" [preselected]="state.configuration.logo_icon"></app-upload>
      </div>

      <app-regular-input-double [form]="form" [controlName]="'main_title'" 
        [label]="'properties.mainTitle'" [placeholder]="'properties.mainTitle'"
        [secondFormControlName]="'main_title_tr'" [message]="'messages.translateMainTitle'"></app-regular-input-double>

      <app-regular-input-double [form]="form" [controlName]="'second_title'" 
        [label]="'properties.secondTitle'" [placeholder]="'properties.secondTitle'"
        [secondFormControlName]="'second_title_tr'" [message]="'messages.translateSecondTitle'"></app-regular-input-double>
  
      <div class="configuration-wrapper__configuration__item">
        <div class="left">
          <label>{{ 'properties.promoImages' | translate }}</label>
        </div>

        <div class="right">
          <div class="right__top">
            <input 
              id="promo-images" 
              type="file" 
              accept="image/*"
              class="upload-input"
              multiple
              (change)="selectMultipleFiles($event)"
              pInputText
            >

            <label 
              class="btn btn__main upload-btn" 
              for="promo-images"
            >
              <i class="pi pi-plus"></i>
              {{ 'common.chooseImages' | translate }}
            </label>
            
            <div class="flex wrap w-80">
              <span 
                class="ml-1"
                *ngFor="let file of selectedPromoImages">
                {{ file.name }}, 
              </span>
            </div>
          </div>

          <div class="right__bottom">
            <div class="images" *ngIf="selectedPromoImagesPreview.length > 0">
              <div 
                *ngFor="let imagePreview of selectedPromoImagesPreview" 
                class="single-image cp"
              >
                <img [src]="imagePreview">
              </div>
            </div>
            <div class="images" *ngIf="state.configuration?.promo_images && selectedPromoImagesPreview.length === 0">
                <div 
                  *ngFor="let image of state.configuration?.promo_images" 
                  class="single-image cp"
                >
                  <img 
                    [src]="imagesUrl + image"
                    (click)="toggleOverviewPromo($event, state.configuration?.promo_images)"
                  >
                </div>
            </div>

            <div
              class="w-full mt-2"
              *ngIf="promoImagesUploadInProgress"
            >
              <p-progressBar 
                [value]="promoImagesProgressValue"
              ></p-progressBar>
            </div>

            <div class="buttons">
              <p class="buttons__label">
                {{ 'common.imagesSizeInfo' | translate }}
              </p>

              <button 
                *ngIf="selectedPromoImages.length > 0"
                class="btn btn__main upload-btn" 
                type="button"
                (click)="uploadPromoImagesNew()"
                [disabled]="promoImagesUploadInProgress"
              >
                <i class="pi pi_upload"></i>
                {{ 'common.upload' | translate }}
              </button>
            </div>
          </div>
        </div>
      </div>
  
      <div class="configuration-wrapper__configuration__item">
        <div class="left">
          <label>{{ 'properties.promoVideo' | translate }}</label>
        </div>
  
        <div class="right">
          <div class="right__top">
            <input 
              id="promo-video" 
              type="file" 
              accept="video/*"
              class="upload-input"
              (change)="selectVideo($event)"
              pInputText>

            <label 
              class="btn btn__main upload-btn" 
              for="promo-video"
            >
              <i class="pi pi-plus"></i>
              {{ 'common.chooseVideo' | translate }}
            </label>

            <span *ngIf="!selectedVideo">
              {{ state.configuration?.promo_video }}
            </span>

            <span *ngIf="selectedVideo">
              {{ selectedVideo.name }}
            </span>
          </div>

          <div class="right__bottom">
            <video 
              *ngIf="state.configuration?.promo_video" 
              controls 
              width="100%" 
              height="300px"
            >
              <source [src]="videoUrl + state.configuration?.promo_video">
            </video>

            <div
              class="w-full mt-2"
              *ngIf="videoUploadInProgress"
            >
              <p-progressBar 
                [value]="videoUploadProgressValue"
              ></p-progressBar>
            </div>

            <div class="buttons" *ngIf="selectedVideo">
              <button 
                class="btn btn__main upload-btn" 
                type="button"
                (click)="uploadVideo()"
                [disabled]="promoImagesUploadInProgress"
              >
                <i class="pi pi-upload"></i>
                {{ 'common.upload' | translate }}
              </button>
            </div>
          </div>
        </div>
      </div>    

      <app-regular-input [form]="form" [controlName]="'phone_number'" 
        [label]="'properties.phoneNumber'" [placeholder]="'properties.phoneNumber'"></app-regular-input>

      <app-regular-input [form]="form" [controlName]="'email'" 
        [label]="'properties.email'" [placeholder]="'properties.email'"></app-regular-input>
      
      <app-regular-input [form]="form" [controlName]="'address'" 
        [label]="'properties.address'" [placeholder]="'properties.address'"></app-regular-input>

      <app-regular-input [form]="form" [controlName]="'facebook_link'" 
        [label]="'Facebook'" [placeholder]="'facebook'"></app-regular-input>

      <app-regular-input [form]="form" [controlName]="'insta_link'" 
        [label]="'Instagram'" [placeholder]="'instagram'"></app-regular-input>

      <div class="configuration-wrapper__configuration__buttons">
        <button 
          class="btn btn__red btn__lg" 
          type="button"
          (click)="cancel()">
          {{ 'common.cancel' | translate }}
        </button>
        
        <button 
          class="btn btn__dark btn__lgfiguration" 
          type="submit">
          {{ 'common.save' | translate }}
        </button>
      </div>
    </div>
  </div>
</form>
