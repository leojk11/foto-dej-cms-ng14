<div class="album__images--image__inner cp" (click)="openPreview()" [class.opacity-50]="imageDisabled">
  <!-- <div
    class="album__images--image__inner__close cp"
    (click)="onDeleteClick($event)">
    <i class="pi pi-times"></i>
  </div> -->
  
  <div class="album__images--image__inner--select cp">
    <p-checkbox 
      [binary]="true" 
      [(ngModel)]="selected" 
      (click)="onCheckboxClick($event)"
    ></p-checkbox>
  </div>

  <img
    [src]="src"
    (error)="toggleError()"
  >

  <div class="album__images--image__inner--name">
    {{ image?.name }}
  </div>
</div>
