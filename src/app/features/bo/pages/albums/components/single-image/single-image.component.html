<div class="album-image__inner cp" (click)="openPreview()">
  <!-- <div
    class="album-image__inner__close cp"
    (click)="onDeleteClick($event)">
    <i class="pi pi-times"></i>
  </div> -->
  
  <div class="album-image__inner--select cp">
    <p-checkbox 
      [binary]="true" 
      [(ngModel)]="selected" 
      (click)="onCheckboxClick($event)"
    ></p-checkbox>
  </div>

  <img
    [src]="src"
    (error)="toggleError()"
  >

  <div class="album-image__inner--name">
    {{ image }}
  </div>
</div>
