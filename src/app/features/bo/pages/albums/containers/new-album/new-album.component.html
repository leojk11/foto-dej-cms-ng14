<div class="add-new-album">
  <div class="add-new-album__inner">
    <form class="mt-2" [formGroup]="addAlbumForm" (ngSubmit)="handleSubmit()">
      <div class="container__flex gap-3" >
        <div class="form-field w-full">
          <label class="form-field__label">
            {{ 'properties.title' | translate }}:
          </label>

          <input
            type="text"
            pInputText
            class="w-full"
            formControlName="title"
            placeholder="{{ 'properties.title' | translate }}..."
          >
        </div>

        <div class="form-field w-full">
          <label class="form-field__label">
            {{ 'properties.date' | translate }}:
          </label>

          <input
            type="text"
            pInputText
            class="w-full"
            formControlName="date"
            placeholder="dd/mm/yyyy"
          >
        </div>

        <div class="form-field w-full">
          <label class="form-field__label">
            {{ 'properties.assignTo' | translate }}:
          </label>

          <p-autoComplete 
            formControlName="assignTo"
            [suggestions]="clients" 
            (completeMethod)="search($event)"
            appendTo="body"
            field="fullname"
            placeholder="{{ 'properties.assignTo' | translate }}..."
            [style]="{width: '100% !important'}"
            (onSelect)="onClientSelected($event)"
          ></p-autoComplete>
        </div>

      </div>
      <div class="container__flex justify-center mt-5">
        <button
          class="btn btn__main"
          type="submit"
          [disabled]="addAlbumForm.invalid"
        >
          {{ 'common.add' | translate }}
        </button>
      </div>
    </form>
  </div>
</div>
