      >
        close
      </span>

  <div class="add-new-album__inner">
    <form class="mt-2" [formGroup]="addAlbumForm" (ngSubmit)="handleSubmit()">
      <div class="container__flex gap-3" >
        <div class="form-field w-full">
          <label class="form-field__label">
            {{ 'properties.title' | translate }}:
          </label>

          <input
            type="text"
            pInputText
            formControlName="title"
            placeholder="{{ 'properties.title' | translate }}..."
          >
        </div>

        <div class="form-field w-full">
          <label class="form-field__label">
            {{ 'properties.date' | translate }}:
          </label>

          <input
            type="text"
            pInputText
            formControlName="date"
            placeholder="dd/mm/yyyy"
          >
        </div>

        <div class="form-field w-full">
          <label class="form-field__label">
            {{ 'properties.assignTo' | translate }}:
          </label>

          <div class="container__flex gap-1 w-full">
            <div class="relative w-full">
              <input
                type="text"
                pInputText
                formControlName="assignTo"
                readonly
                placeholder="{{ 'properties.assignTo' | translate }}..."
                (click)="onSelectClient()"
              >
              <span
                class="material-symbols-outlined input--icon"
                *ngIf="hasClient"
                (click)="removeSelectedClient()"
              >
                close
              </span>
            </div>
<!-- 
            <button
              class="btn btn__main--outline ml-auto"
              type="button"
              (click)="onSelectClient()"
              [disabled]="hasClient"
            >
              {{ 'common.select' | translate }}
            </button> -->
          </div>
        </div>

      </div>
      <div class="container__flex justify-center mt-5">
        <button
          class="btn btn__main"
          type="submit"
          [disabled]="addAlbumForm.invalid"
        >
          {{ 'common.add' | translate }}
        </button>
      </div>
    </form>
  </div>
</div>

<app-assign-album
  *ngIf="openSelectClient"
  [client]="selectedClient"
  (clientSelected)="onClientSelected($event)"
  (close)="onCloseModal()"
></app-assign-album>
