<ng-container *ngIf="albumsStore.state$ | async as state">
  <div class="albums-buttons">
    <div class="container__flex gap-5">
      <button
        class="btn btn__icon btn__icon--blue shadow-small border-none"
        (click)="location.back()"
      >
        <i class="pi pi-arrow-left"></i>
      </button>
    </div>
  
    <div class="container__flex">
      <p-inputSwitch 
        class="mr-1" 
        *ngIf="state.previewAlbum" 
        [(ngModel)]="state.previewAlbum.active"
        (onChange)="changeStatus($event)"
      ></p-inputSwitch>

      <button
        class="btn btn__icon--blue btn__main--sm mr-1"
        type="submit"
        (click)="goToUpload()"
        pTooltip="{{ 'common.upload' | translate }}" 
        tooltipPosition="top">
        <i class="pi pi-upload"></i>
      </button>
    
      <button
        class="btn btn__icon--orange btn__main--sm mr-1"
        type="button"
        (click)="openEditModal()"
        pTooltip="{{ 'common.edit' | translate }}" 
        tooltipPosition="top">
        <i class="pi pi-pencil"></i>
      </button>
    
      <button
        class="btn btn__icon--red btn__main--sm"
        type="button"
        (click)="deleteAlbum()"
        pTooltip="{{ 'common.delete' | translate }}" 
        tooltipPosition="top">
        <i class="pi pi-trash"></i>
      </button>
    </div>
  </div>
  
  <div class="album-preview">
    <div 
      *ngIf="state.loading"
      class="w-full h-full flex justify-center align-center" 
    >
      <app-spinner></app-spinner>
    </div>
  
    <div class="album-preview__info" *ngIf="!state.loading">
      <div class="album-preview__info__item">
        <div class="label">{{ 'properties.numImages' | translate }}: </div>
        <div class="content">{{ state.images?.imagesCount }}</div>
      </div>
  
      <div class="album-preview__info__item">
        <div class="label">{{ 'properties.assignedTo' | translate }}: </div>
        <div class="content">{{ state.previewAlbum?.assigned_to?.fullname }}</div>
      </div>
    </div>
  
    <div class="separator my-2" *ngIf="!state.loading"></div>
  
    <div *ngIf="!state.loading && state.images?.images">
      <!-- [selectedImages]="state.selectedImages?.images" -->

      <app-album
        [images]="state.images?.images"
        [selectedImages]="state.selectedImages"
        [isAdmin]="true"
        [isSelect]="false"
        (onImageSearch)="filter($event)"
        (onSelect)="onImageSelect($event)"
      ></app-album>
    </div>
  </div>
</ng-container>

<p-confirmDialog 
  [key]="'delete'"
  header="{{ 'common.confirmation' | translate }}" 
  [style]="{ width: '50%',  padding: '1rem' }"  
></p-confirmDialog>
