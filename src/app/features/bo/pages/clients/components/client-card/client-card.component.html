<div class="client" >
  <div class="client__name">
    <div class="client__img">
      <img
        src="../../../../../../../assets/img/wedding_detail.jpeg"
        alt=""
      >
    </div>
    <div class="container__flex-col align-center">
      <span>
        {{ client.fullname }}
      </span>
      <span class="text-light">
        {{ client.phone_number }}
      </span>
    </div>
    <div class="client__status">
      <p [ngClass]="client.account_status === 'ACTIVE' ? 'isActive' : 'isExpired'">
        {{ client.account_status | titlecase }}
      </p>
    </div>
  </div>

  <div class="client__actions">
    <button 
      class="btn btn__icon btn__icon--blue" 
      (click)="sendInvite(client.id)"
    >
      <i class="pi pi-envelope fw-500 text-lg"></i>
    </button>

    <button 
      class="btn btn__icon btn__icon--dark" 
      [routerLink]="['details', client.id]"
    >
      <i class="pi pi-info-circle fw-500 text-lg"></i>
    </button>

    <button 
      class="btn btn__icon btn__icon--red" 
      (click)="deleteClient(client)"
    >
      <i class="pi pi-trash fw-500 text-lg"></i>
    </button>
  </div>
</div>

<p-confirmDialog 
  key="delete"
  header="{{ 'common.confirmation' | translate }}" 
  [style]="{ width: '50%',  padding: '1rem' }"  
></p-confirmDialog>

<p-confirmDialog 
  key="invite"  
  header="{{ 'common.confirmation' | translate }}" 
  [style]="{ width: '50%',  padding: '1rem' }" 
></p-confirmDialog>
