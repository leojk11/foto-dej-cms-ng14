<div 
  class="client-card" 
  [routerLink]="['details', client.id]"
>
  <div class="client-card__name">
    <div class="client-card__img">
      <img
        src="../../../../../../../assets/img/wedding_detail.jpeg"
      >
    </div>

    <div class="container__flex-col align-center">
      <span>
        {{ client.fullname }}
      </span>
      <span class="text-light">
        {{ client.phone_number }}
      </span>
    </div>
    
    <div class="client-card__status">
      <p [ngClass]="client.account_status === 'ACTIVE' ? 'isActive' : 'isExpired'">
        {{ (client.account_status === 'ACTIVE' ? 'status.active' : 'status.suspended') | translate | titlecase }}
      </p>
    </div>
  </div>

  <div class="client-card__actions">
    <button 
      class="btn btn__icon btn__icon--blue" 
      (click)="sendInvite($event)"
      pTooltip="{{ 'common.sendInvite' | translate }}" 
      tooltipPosition="top"
    >
      <i class="pi pi-envelope fw-500 text-lg"></i>
    </button>

    <button 
      class="btn btn__icon btn__icon--dark" 
      [routerLink]="['details', client.id]"
      pTooltip="{{ 'common.moreInfo' | translate }}" 
      tooltipPosition="top"
    >
      <i class="pi pi-info-circle fw-500 text-lg"></i>
    </button>

    <button 
      class="btn btn__icon btn__icon--red" 
      (click)="deleteClient($event)"
      pTooltip="{{ 'common.delete' | translate }}" 
      tooltipPosition="top"
    >
      <i class="pi pi-trash fw-500 text-lg"></i>
    </button>
  </div>
</div>

<p-confirmdialog 
  [key]="'delete'"
  header="{{ 'common.confirmation' | translate }}" 
  [style]="{ width: '50%',  padding: '1rem' }"  
></p-confirmdialog>

<p-confirmdialog 
  [key]="'invite'"  
  header="{{ 'common.confirmation' | translate }}" 
  [style]="{ width: '50%',  padding: '1rem' }" 
></p-confirmdialog>
