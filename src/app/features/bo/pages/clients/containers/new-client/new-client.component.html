<div class="new-client">
  <div class="new-client__inner">
    <form [formGroup]="form" (submit)="onSubmit()">
      <div class="container__flex-col gap-3 justify-center" >
        <div class="form-field w-full">
          <label class="form-field__label">
            {{ 'properties.firstname' | translate }}:
          </label>

          <input
            type="text"
            pInputText
            formControlName="firstname"
          >
        </div>

        <div class="form-field w-full">
          <label class="form-field__label">
            {{ 'properties.lastname' | translate }}:
          </label>

          <input
            type="text"
            pInputText
            formControlName="lastname"
          >
        </div>

        <div class="form-field w-full">
          <label class="form-field__label">
            {{ 'properties.username' | translate }}:
          </label>

          <input
            type="text"
            pInputText
            formControlName="username"
          >
        </div>

        <div class="form-field w-full">
          <label class="form-field__label">
            {{ 'properties.email' | translate }}:
          </label>

          <input
            type="text"
            pInputText
            formControlName="email"
          >
        </div>

        <div class="form-field w-full" *ngIf="!editMode">
          <label class="form-field__label">
            {{ 'properties.password' | translate }}:
          </label>

          <input
            type="text"
            pInputText
            formControlName="password"
          >
        </div>

        <div class="form-field w-full">
          <label class="form-field__label">
            {{ 'properties.phoneNumber' | translate }}:
          </label>

          <input
            type="text"
            pInputText
            formControlName="phone_number"
          >
        </div>

      </div>
      <div class="container__flex justify-center mt-5">
        <button
          class="btn btn__main"
          type="submit"
          [disabled]="form.invalid"
        >
          <ng-container *ngIf="editMode">
            {{ 'common.edit' | translate }}
          </ng-container>
          <ng-container *ngIf="!editMode">
            {{ 'common.add' | translate }}
          </ng-container>
        </button>
      </div>
    </form>
  </div>
</div>
