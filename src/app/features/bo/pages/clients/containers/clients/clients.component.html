<div *ngIf="clientStore.state$ | async as state">
  <div class="clients">
    <div class="clients__header">
      <div class="clients__header--filter">
        <div class="text-xl">
          {{ 'common.filters' | translate }}
        </div>

        <div class="flex gap-2">
          <input 
            type="text" 
            pInputText
            class="w-3"
            placeholder="{{ 'common.searchName' | translate}}"
            [(ngModel)]="nameSearch"
            (keydown.enter)="filter()"
          >
          <input 
            type="text" 
            pInputText
            class="w-3"
            placeholder="{{ 'common.searchPhone' | translate}}"
            [(ngModel)]="phoneSearch"
            (keydown.enter)="filter()"
          >
  
          <button 
            class="btn btn__search"
            (click)="filter()"
          >
            <i 
              class="pi pi-search"
              
            ></i>
          </button>
        </div>
      </div>
      <div class="clients__header--buttons">
        <button
          class="btn btn__main "
          type="button"
          (click)="openModal()"
        >
          {{ 'clients.newClient' | translate }}
        </button>
      </div>
    </div>

    <div class="clients__content">
      <div class="page__loading mt-5" *ngIf="state.loading">
        <app-spinner></app-spinner>
      </div>
  
      <div *ngIf="!state.loading" class="container__flex gap-2 wrap">
        <div *ngFor="let client of state.list" >
          <app-client-card
            [client] = "client"
            (clientUpdated)="clientStore.getAllClients()"
          ></app-client-card>
        </div>
      </div>
  
      <p-paginator
        *ngIf="state.total > state.params.take"
        [rows]="state.params.take"
        [totalRecords]="state.total"
        (onPageChange)="onPageChange($event)"
      ></p-paginator>
    </div>
  </div>
</div>
