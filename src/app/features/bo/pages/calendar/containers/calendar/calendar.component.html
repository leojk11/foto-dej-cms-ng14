<div class="calendar">
  <div class="calendar__header flex">
    <button
      class="btn btn__icon btn__icon--blue shadow-small border-none"
      (click)="location.back()">
      <i class="pi pi-arrow-left"></i>
    </button>

    <div class="container__flex gap-1">
      <button 
        class="btn btn__icon btn__icon--dark"
        (click)="goToDate()">
        <i class="pi pi-calendar"></i>
      </button>

      <button
        class="btn btn__main "
        type="button"
        (click)="openModal()">
        {{ 'calendar.newSchedule' | translate }}
      </button>
    </div>
  </div>

  <div class="p-2">
    <full-calendar
      *ngIf="showCalendar"
      #calendar
      [options]="calendarOptions"
    ></full-calendar>
  </div>
</div>
