<div class="add-new-schedule">
  <div class="add-new-schedule__top">
    <div class="add-new-schedule__top__title">
      <h3>{{ 'calendar.newSchedule' | translate }}</h3>
    </div>

    <div class="add-new-schedule__top__close">
      <span
        class="material-symbols-outlined cp"
        (click)="dialogRef.close()"
      >
        close
      </span>
    </div>
  </div>

  <div class="add-new-schedule__inner">
    <div class="w-full" *ngIf="loading">
      <app-spinner></app-spinner>
    </div>

    <form *ngIf="!loading" class="mt-2" [formGroup]="form" (ngSubmit)="handleSubmit()">
      <div class="container__flex-col gap-4 justify-center" >
        <div class="form-field">
          <label class="form-field__label">
            {{ 'properties.date' | translate }} (*):
          </label>

          <input
            type="text"
            class="form-field__input"
            formControlName="date"
            placeholder="2022-09-10..."
            readonly
          >
        </div>

        <div class="form-field">
          <label class="form-field__label">
            {{ 'properties.title' | translate }} (*):
          </label>

          <input
            type="text"
            class="form-field__input"
            formControlName="title"
            placeholder="{{ 'properties.title' | translate | lowercase }}..."
          >
        </div>

        <div class="form-field">
          <label class="form-field__label">
            {{ 'properties.time' | translate }}:
          </label>

          <input
            type="text"
            class="form-field__input"
            formControlName="time"
            placeholder="10:00..."
          >
        </div>

        <div class="form-field">
          <label class="form-field__label">
            {{ 'properties.location' | translate }}:
          </label>

          <input
            type="text"
            class="form-field__input"
            formControlName="location"
            placeholder="{{ 'properties.location' | translate | lowercase }}..."
          >
        </div>

        <div class="form-field">
          <label class="form-field__label">
            {{ 'properties.contactNumber' | translate }}:
          </label>

          <input
            type="text"
            class="form-field__input"
            formControlName="contact_number"
            placeholder="{{ 'properties.contactNumber' | translate | lowercase }}..."
          >
        </div>

        <div class="form-field">
          <label class="form-field__label">
            {{ 'properties.description' | translate }}:
          </label>

          <textarea
            class="form-field__input"
            formControlName="description"
            placeholder="{{ 'properties.description' | translate | lowercase }}..."
          ></textarea>
        </div>


        <div class="form-field justify-center gap-2 mt-5">
          <button
            *ngIf="!editMode"
            class="btn btn__main"
            type="submit"
            [disabled]="form.invalid"
          >
            {{ 'common.add' | translate }}
          </button>

          <button
            *ngIf="editMode"
            class="btn btn__main"
            type="submit"
            [disabled]="form.invalid"
          >
            {{ 'common.edit' | translate }}
          </button>

          <button
            *ngIf="editMode"
            class="btn btn__main btn__main--sm"
            type="button"
            (click)="handleDelete()"
          >
            <span class="material-symbols-outlined">
              delete
            </span>
          </button>
        </div>
      </div>
    </form>
  </div>
